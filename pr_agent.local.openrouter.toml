# Локальные переопределения pr-agent — вариант для OpenRouter (облачная модель, без GPU).
# Активируется строкой PR_AGENT_LOCAL_CONFIG=pr_agent.local.openrouter.toml в .env;
# ключ — OPENROUTER_API_KEY там же (в этот файл секреты не кладём).
# Перекрывает .pr_agent.toml из репозитория так же, как pr_agent.local.toml (см. README).

[config]
# GLM-5.3-Flash через OpenRouter: ~$0.045 / $0.14 за 1M токенов (вход / выход), контекст 1.3M,
# Coding Index 71.5 (у gpt-oss-120b — 21–30) при той же цене. Reasoning у модели всегда включён.
# Модели нет в списке pr-agent, поэтому лимит контекста задаём вручную; 120k хватает на любой PR,
# а больше и не нужно — это верхняя граница промпта, то есть и расходов.
model = "openrouter/z-ai/glm-5.3-flash"
fallback_models = ["openrouter/z-ai/glm-5.3-flash"]
custom_model_max_tokens = 120000
# Прошлый вариант, если захочется сравнить:
# model = "openrouter/openai/gpt-oss-120b"
# fallback_models = ["openrouter/openai/gpt-oss-120b"]
custom_reasoning_model = true   # reasoning-модель: не слать temperature и т.п.
ai_timeout = 300                # облако отвечает за секунды; 5 минут — с запасом
enable_custom_labels = true     # describe выбирает лейблы из [custom_labels] ниже

[openrouter]
# Глубина рассуждений (GLM-5.3-Flash: low / high / max): low — быстро и дёшево, для ревью обычно
# достаточно; high — если находки покажутся поверхностными, цена вырастет за счёт токенов рассуждений.
reasoning_effort = "low"
# Жёсткий список провайдеров, если важно, куда уходит код (например, только с политикой
# zero-data-retention). Имена провайдеров — на странице модели в OpenRouter, вкладка Providers.
# provider_only = ["provider-name"]

[pr_reviewer]
# Не искать в PR ссылки на тикеты (GitHub Issues/Jira) и не проверять соответствие им:
# мы тикеты к PR не привязываем, а попытка их достать иногда падает с KeyError 'message'
# (ошибка некритичная, но шумит в логе и тратит время). Влияет и на describe, и на review.
require_ticket_analysis_review = false
# Просить модель дать общую рекомендацию (safe_to_merge / merge_with_caution / changes_required) —
# поллер использует её как один из сигналов для предварительного апрува (AUTO_APPROVE в .env).
require_merge_recommendation = true
extra_instructions = "ЯЗЫК ОТВЕТА: РУССКИЙ. Весь свободный текст в ответе — описания находок, объяснения, рекомендации, оценку, заголовки проблем — пиши только на русском языке, как для русскоязычной команды. Не переводи и не меняй: ключи YAML, служебные значения схемы (Yes, No, None, true, false), имена файлов, идентификаторы и фрагменты кода. Ответ на английском считается ошибкой."

[pr_description]
publish_labels = true           # вешать на PR лейблы из [custom_labels]; лейблы автора не трогаются
extra_instructions = "ЯЗЫК ОТВЕТА: РУССКИЙ. Описание PR, краткое содержание изменений и построчные описания изменений по файлам (changes summary, changes title) пиши только на русском языке. Заголовок PR не меняй. Не переводи и не меняй: ключи YAML, значения полей type и labels (они должны точно совпадать с разрешённым списком), имена файлов, идентификаторы и фрагменты кода. Ответ на английском считается ошибкой."

# Лейблы, которые describe вешает на PR по содержанию изменений (можно несколько на один PR).
# Имя секции = имя лейбла на GitHub (создаётся автоматически, если его нет), description — подсказка модели.
[custom_labels."feature"]
description = "Новая функциональность или заметное расширение существующей"
[custom_labels."bug fix"]
description = "Исправление ошибки или некорректного поведения"
[custom_labels."ui"]
description = "Изменения интерфейса: вёрстка, стили, тексты, UX без новой бизнес-логики"
[custom_labels."refactoring"]
description = "Переработка кода без изменения поведения для пользователя"
[custom_labels."tests"]
description = "Добавление или изменение тестов"
[custom_labels."dependencies"]
description = "Обновление зависимостей, настройка сборки, CI, конфигурация"
[custom_labels."docs"]
description = "Документация, комментарии, README"

[pr_code_suggestions]
extra_instructions = "ЯЗЫК ОТВЕТА: РУССКИЙ. Заголовок каждого предложения (one_sentence_summary), объяснение (suggestion_content) и обозначение проблемы пиши только на русском языке. Не переводи и не меняй: ключи YAML, значение поля label, имена файлов, а также сам код в existing_code и improved_code. Ответ на английском считается ошибкой."
parallel_calls = true         # облако — чанки improve можно слать параллельно
# suggestions_score_threshold = 7   # показывать только уверенные предложения (0–10), если будет много шума

