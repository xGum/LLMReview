# Локальные переопределения pr-agent.
# Перекрывают .pr_agent.toml из репозитория: каждый ключ отсюда передаётся pr-agent
# как CLI-аргумент, а CLI у pr-agent имеет приоритет над репозиторным файлом.
# Менять можно на ходу — подхватывается при следующем запуске поллера.
#
# Поддерживаются: [секции], строки в кавычках, числа, true/false, массивы
# (в т.ч. многострочные), комментарии через #. Многострочные строки """...""" — нет.

[config]
# ollama_chat/ ходит в /api/chat с нормальными ролями — для gpt-oss это критично,
# через ollama/ (старый /api/generate) модель отдаёт пустой content.
model = "ollama_chat/gpt-oss:20b"
fallback_models = ["ollama_chat/gpt-oss:20b"]
custom_reasoning_model = true   # не слать temperature и т.п. reasoning-модели
ai_timeout = 1800               # секунд; дефолт pr-agent — 120, локальной модели мало
custom_model_max_tokens = 64000

# [ollama]
# api_base = "http://localhost:11434"

# Язык ответов. response_language=ru-RU из репо даёт модели лишь код локали — gpt-oss:20b
# его игнорирует и копирует язык английских примеров из промпта. Поэтому инструкция явно,
# по-русски, для каждой команды. Служебные значения схемы (Yes/No/None) и код не переводим.
[pr_reviewer]
extra_instructions = "ЯЗЫК ОТВЕТА: РУССКИЙ. Весь свободный текст в ответе — описания находок, объяснения, рекомендации, оценку, заголовки проблем — пиши только на русском языке, как для русскоязычной команды. Не переводи и не меняй: ключи YAML, служебные значения схемы (Yes, No, None, true, false), имена файлов, идентификаторы и фрагменты кода. Ответ на английском считается ошибкой."

[pr_description]
extra_instructions = "ЯЗЫК ОТВЕТА: РУССКИЙ. Описание PR, краткое содержание изменений и построчные описания изменений по файлам (changes summary, changes title) пиши только на русском языке. Заголовок PR не меняй. Не переводи и не меняй: ключи YAML, значение поля type, имена файлов, идентификаторы и фрагменты кода. Ответ на английском считается ошибкой."

[pr_code_suggestions]
extra_instructions = "ЯЗЫК ОТВЕТА: РУССКИЙ. Заголовок каждого предложения (one_sentence_summary), объяснение (suggestion_content) и обозначение проблемы пиши только на русском языке. Не переводи и не меняй: ключи YAML, значение поля label, имена файлов, а также сам код в existing_code и improved_code. Ответ на английском считается ошибкой."
parallel_calls = false        # GPU одна — параллельные запросы к Ollama только встанут в очередь
# suggestions_score_threshold = 7   # показывать только уверенные предложения (0–10), если будет много шума

# Если после этого текст всё равно частично английский — отключить английские примеры в промпте:
# duplicate_prompt_examples = false   # (в секции [config]; ценой чуть менее стабильного YAML)
